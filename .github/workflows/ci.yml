name: Validate Deployment Configuration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail

          actionlint_dir="$(mktemp -d)"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"

          curl --fail --silent --show-error --location \
            "$base_url/$archive" \
            --output "$actionlint_dir/$archive"
          curl --fail --silent --show-error --location \
            "$base_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            --output "$actionlint_dir/checksums.txt"

          (
            cd "$actionlint_dir"
            grep "  $archive$" checksums.txt | sha256sum --check
            tar -xzf "$archive"
          )

          "$actionlint_dir/actionlint" -color=false

      - name: Check required deployment files
        run: |
          set -euo pipefail

          required_files=(
            compose.yml
            traefik/traefik.yml
            .github/workflows/deploy-test.yml
            .github/workflows/deploy-alphatest.yml
            .github/workflows/deploy-landing.yml
            .github/workflows/deploy-infrastructure.yml
            .github/workflows/reusable-deploy.yml
            docs/DEPLOYMENT.md
          )

          for path in "${required_files[@]}"; do
            test -f "$path"
          done

          obsolete_files=(
            docker-compose.staging.yml
            docker-compose.alphatest.yml
            docker-compose.prod.yml
            docker-compose.traefik.yml
            .github/workflows/add-ssh-key.yml
            .github/workflows/test-deploy.yml
            .github/workflows/alphatest-deploy.yml
            .github/workflows/landing-page-deploy.yml
            .github/workflows/traefik-deploy.yml
          )

          for path in "${obsolete_files[@]}"; do
            test ! -e "$path"
          done

      - name: Validate canonical Compose configuration
        run: |
          set -euo pipefail

          trap 'rm -f .env.traefik .env.test .env.alphatest' EXIT

          printf 'CF_DNS_API_TOKEN=ci-placeholder\n' > .env.traefik
          printf '%s\n' \
            'NEXT_PUBLIC_BACKEND_URL=https://example.invalid' \
            'NEXT_PUBLIC_REALTIME_URL=https://example.invalid' \
            'NEXT_PUBLIC_UI_SKIN=default' > .env.test
          cp .env.test .env.alphatest

          docker compose \
            --env-file .env.traefik \
            -f compose.yml \
            config --quiet

      - name: Check secret-file hygiene
        run: |
          set -euo pipefail

          tracked_sensitive="$(
            git ls-files |
              grep -E '(^|/)(\.env([^/]*)?|acme\.json|.*\.(pem|key))$' |
              grep -v '^\.env\.example$' || true
          )"

          if [ -n "$tracked_sensitive" ]; then
            printf 'Sensitive files are tracked:\n%s\n' "$tracked_sensitive"
            exit 1
          fi

          if git grep -n -E 'BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY'; then
            echo 'A private key appears to be committed.'
            exit 1
          fi
