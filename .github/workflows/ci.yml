name: Validate Deployment Configuration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail

          actionlint_dir="$(mktemp -d)"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"

          curl --fail --silent --show-error --location \
            "$base_url/$archive" \
            --output "$actionlint_dir/$archive"
          curl --fail --silent --show-error --location \
            "$base_url/actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            --output "$actionlint_dir/checksums.txt"

          (
            cd "$actionlint_dir"
            grep "  $archive$" checksums.txt | sha256sum --check
            tar -xzf "$archive"
          )

          "$actionlint_dir/actionlint" -color=false

      # Changed by Codex GPT-5 on 2026-07-28.
      # Frontend CI now enforces the repository boundary: app-release files
      # are required, while server Compose and Traefik must remain in infra.
      - name: Check deployment ownership boundary
        run: |
          set -euo pipefail

          required_files=(
            .github/workflows/deploy-test.yml
            .github/workflows/deploy-alphatest.yml
            .github/workflows/deploy-landing.yml
            .github/workflows/reusable-deploy.yml
            docs/DEPLOYMENT.md
            Dockerfile
            docker-compose.dev.yml
            .env.example
          )

          for path in "${required_files[@]}"; do
            test -f "$path"
          done

          forbidden_files=(
            compose.yml
            traefik
            .github/workflows/deploy-infrastructure.yml
            docker-compose.staging.yml
            docker-compose.alphatest.yml
            docker-compose.prod.yml
            docker-compose.traefik.yml
            .github/workflows/add-ssh-key.yml
            .github/workflows/test-deploy.yml
            .github/workflows/alphatest-deploy.yml
            .github/workflows/landing-page-deploy.yml
            .github/workflows/traefik-deploy.yml
          )

          for path in "${forbidden_files[@]}"; do
            test ! -e "$path"
          done

          grep -F 'source_ref: test' .github/workflows/deploy-test.yml
          grep -F 'source_ref: alphatest' .github/workflows/deploy-alphatest.yml
          grep -F 'source_ref: landing-page' .github/workflows/deploy-landing.yml
          grep -F '/usr/local/bin/deploy-frontend' .github/workflows/reusable-deploy.yml

          deployment_workflows=(
            .github/workflows/deploy-test.yml
            .github/workflows/deploy-alphatest.yml
            .github/workflows/deploy-landing.yml
            .github/workflows/reusable-deploy.yml
          )

          if grep -n -E 'docker compose|ansible-playbook|traefik/traefik\.yml' \
            "${deployment_workflows[@]}"; then
            echo 'Frontend workflows still contain infrastructure operations.'
            exit 1
          fi

      - name: Validate local frontend Compose configuration
        run: |
          set -euo pipefail
          docker compose \
            --env-file .env.example \
            --file docker-compose.dev.yml \
            config --quiet

      - name: Check secret-file hygiene
        run: |
          set -euo pipefail

          tracked_sensitive="$(
            git ls-files |
              grep -E '(^|/)(\.env([^/]*)?|acme\.json|.*\.(pem|key))$' |
              grep -v '^\.env\.example$' || true
          )"

          if [ -n "$tracked_sensitive" ]; then
            printf 'Sensitive files are tracked:\n%s\n' "$tracked_sensitive"
            exit 1
          fi

          if git grep -n -E 'BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY'; then
            echo 'A private key appears to be committed.'
            exit 1
          fi
